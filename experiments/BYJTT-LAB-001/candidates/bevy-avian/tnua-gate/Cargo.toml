[package]
name = "byjtt-lab-001-bevy-tnua"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["bevy_asset"] }
avian3d = { version = "=0.7.0", default-features = false, features = ["3d", "f32", "parry-f32"] }
bevy-tnua = "=0.32.0"
bevy-tnua-avian3d = "=0.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.143"
