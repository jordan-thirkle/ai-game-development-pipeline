<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>BYJTT-LAB-001 — Three.js/WebGPU Phase A</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: white; }
      #stats { position: absolute; top: 10px; left: 10px; padding: 8px 10px; border-radius: 8px; background: rgb(0 0 0 / .58); font-size: 12px; line-height: 1.35; }
      #controls { position: absolute; inset: auto 10px 10px 10px; display: flex; justify-content: space-between; align-items: end; gap: 12px; pointer-events: auto; }
      .cluster { display: grid; grid-template-columns: repeat(3, 54px); gap: 6px; }
      button { min-width: 54px; min-height: 48px; border: 1px solid rgb(255 255 255 / .35); border-radius: 12px; background: rgb(15 15 15 / .72); color: white; font: inherit; }
      button:active { transform: scale(.97); }
      #actions { display: grid; grid-template-columns: repeat(2, minmax(66px, 1fr)); gap: 7px; }
      #upgrade { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); width: min(310px, calc(100% - 32px)); padding: 16px; border-radius: 14px; background: rgb(10 10 10 / .9); text-align: center; pointer-events: auto; }
      #upgrade[hidden] { display: none; }
      #upgrade button { width: 100%; margin-top: 10px; }
      #banner { position: absolute; top: 10px; right: 10px; max-width: 55%; padding: 6px 9px; border-radius: 8px; background: rgb(0 0 0 / .58); font-size: 11px; text-align: right; }
      @media (min-width: 700px) { #controls { max-width: 680px; left: 50%; transform: translateX(-50%); width: calc(100% - 20px); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="stats" aria-live="polite"></div>
      <div id="banner"></div>
      <div id="upgrade" hidden>
        <strong>Upgrade</strong>
        <div>Reward secured. Choose one.</div>
        <button id="upgrade-damage" type="button">+20% damage</button>
      </div>
      <div id="controls" aria-label="Touch controls">
        <div class="cluster" aria-label="Movement">
          <span></span><button data-hold="KeyW" aria-label="Move forward">▲</button><span></span>
          <button data-hold="KeyA" aria-label="Move left">◀</button><button data-hold="KeyS" aria-label="Move backward">▼</button><button data-hold="KeyD" aria-label="Move right">▶</button>
        </div>
        <div id="actions">
          <button data-tap="ArrowLeft" aria-label="Camera left">Cam ◀</button>
          <button data-tap="ArrowRight" aria-label="Camera right">Cam ▶</button>
          <button data-tap="Space" aria-label="Attack">Attack</button>
          <button data-tap="KeyE" aria-label="Interact">Interact</button>
          <button id="save" type="button">Save</button>
          <button data-tap="Escape" aria-label="Pause">Pause</button>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const heldCodes = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'ShiftRight'];
        const releaseHeldKeys = () => {
          for (const code of heldCodes) window.dispatchEvent(new KeyboardEvent('keyup', { code, bubbles: true }));
        };
        window.addEventListener('blur', releaseHeldKeys, { capture: true });
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') releaseHeldKeys();
        });
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
