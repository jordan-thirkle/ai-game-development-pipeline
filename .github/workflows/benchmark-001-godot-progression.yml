name: Benchmark 001 Godot progression gate

on:
  pull_request:
    paths:
      - 'experiments/BYJTT-LAB-001/candidates/godot/progression-gate/**'
      - '.github/workflows/benchmark-001-godot-progression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GODOT_RELEASE_TAG: 4.7.1-stable
      GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
      EXPECTED_GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'checked_out_sha=%s\nexpected_sha=%s\n' "$HEAD_SHA" "$EXPECTED_SHA" | tee /tmp/revision.txt
          test "$HEAD_SHA" = "$EXPECTED_SHA"

      - name: Verify shared contract constants
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT=experiments/BYJTT-LAB-001/shared/contract.json
          jq -e '
            .arena.width == 24 and .arena.depth == 32 and
            .arena.player_spawn == [0,0,10] and .arena.salvage_spawn == [5,0,0] and
            .player.walk_speed == 3.5 and .player.attack_damage == 34 and
            .player.attack_range == 1.8 and .player.attack_cooldown == 0.55 and
            .salvage.max_health == 34 and .salvage.reward_count == 1 and
            .salvage.pickup_radius == 1.25 and
            .upgrade.id == "damage-up-1" and .upgrade.damage_multiplier == 1.2
          ' "$CONTRACT" | tee /tmp/shared-contract-check.txt

      - name: Download and verify pinned Godot runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          OBSERVED_SHA="$(sha256sum /tmp/godot.zip | awk '{print $1}')"
          printf 'release_tag=%s\nurl=%s\nexpected_sha256=%s\nobserved_sha256=%s\n' "$GODOT_RELEASE_TAG" "$GODOT_URL" "$EXPECTED_GODOT_SHA256" "$OBSERVED_SHA" | tee /tmp/godot-provenance.txt
          test "$OBSERVED_SHA" = "$EXPECTED_GODOT_SHA256"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64*' | head -n1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version | tee /tmp/godot-version.txt

      - name: Parse project and scripts
        working-directory: experiments/BYJTT-LAB-001/candidates/godot
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --quit 2>&1 | tee /tmp/godot-parse.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script' /tmp/godot-parse.log

      - name: Execute progression gate
        working-directory: experiments/BYJTT-LAB-001/candidates/godot
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script progression-gate/progression_tracer.gd 2>&1 | tee /tmp/godot-progression.log
          mapfile -t lines < <(grep '^BYJTT_RESULT=' /tmp/godot-progression.log)
          test "${#lines[@]}" -eq 1
          printf '%s\n' "${lines[0]#BYJTT_RESULT=}" | tee /tmp/progression-result.json
          jq -e '
            .result == "pass" and
            .experiment_id == "BYJTT-LAB-001" and
            .player_controller == "CharacterBody3D" and
            .movement_api == "move_and_slide" and
            .arena_width_m == 24 and .arena_depth_m == 32 and
            .player_spawn == [0,0,10] and .salvage_spawn == [5,0,0] and
            .walk_speed_mps == 3.5 and
            .attack_damage == 34 and .attack_range_m == 1.8 and .attack_cooldown_s == 0.55 and
            .salvage_max_health == 34 and .pickup_radius_m == 1.25 and
            .reward_count == 1 and .upgrade_id == "damage-up-1" and .damage_multiplier == 1.2 and
            (.effective_attack_damage - 40.8 | fabs) < 0.0001 and
            .valid_attack_count == 1 and .attack_press_count >= 1 and
            .interact_press_count >= 1 and .upgrade_selection_count == 1 and
            .attack_distance_m <= 1.8 and .pickup_distance_m <= 1.25 and
            (.selected_upgrades | index("damage-up-1")) != null and
            .action_input_executed == true and .physical_os_input_executed == false and
            .observation_mutation_isolated == true and
            .direct_salvage_health_setter_exposed == false and
            .direct_reward_grant_exposed == false and
            .direct_upgrade_grant_exposed == false and
            .direct_position_setter_exposed == false and
            .test_only_gameplay_mutation_shortcut == false and
            .post_physics_arena_clamp == false and .persistence_executed == false and
            (.failures | length) == 0
          ' /tmp/progression-result.json

      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          set -u
          : > /tmp/evidence-sha256.txt
          for file in \
            /tmp/revision.txt \
            /tmp/shared-contract-check.txt \
            /tmp/godot-provenance.txt \
            /tmp/godot-version.txt \
            /tmp/godot-parse.log \
            /tmp/godot-progression.log \
            /tmp/progression-result.json; do
            if [ -f "$file" ]; then sha256sum "$file" >> /tmp/evidence-sha256.txt; fi
          done
          cat /tmp/evidence-sha256.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: godot-progression-gate-${{ github.run_id }}
          path: |
            /tmp/revision.txt
            /tmp/shared-contract-check.txt
            /tmp/godot-provenance.txt
            /tmp/godot-version.txt
            /tmp/godot-parse.log
            /tmp/godot-progression.log
            /tmp/progression-result.json
            /tmp/evidence-sha256.txt
          if-no-files-found: warn
