name: Live external discovery v2 once

on:
  pull_request:
    paths:
      - '.github/workflows/live-external-discovery-v2-once.yml'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run one live bounded discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run discover:external -- examples/creator-mode/external-discovery-brief-v2.json /tmp/external-discovery-v2.json
      - name: Emit measured summary and enforce autonomy boundary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/external-discovery-v2.json', 'utf8'));
          for (const candidate of result.queue) {
            if (candidate.origin === 'github_search' && candidate.publication_eligible !== false) throw new Error(`${candidate.candidate_id} became publication eligible`);
            if (candidate.origin === 'github_search' && candidate.screening_status === 'canonical_qualified') throw new Error(`${candidate.candidate_id} self-promoted`);
          }
          if (result.unsafe_promotions !== 0) throw new Error('unsafe promotions reported');
          console.log(JSON.stringify({
            external_actions: result.search_actions + result.source_fetches,
            candidate_count: result.candidate_count,
            canonical_candidates: result.canonical_candidate_count,
            new_discoveries: result.new_discovery_count,
            candidate_coverage_pct: result.capability_candidate_coverage_pct,
            canonical_qualified_coverage_pct: result.canonical_qualified_coverage_pct,
            unsafe_promotions: result.unsafe_promotions,
            gaps: result.gaps
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: live-external-discovery-v2-once
          path: /tmp/external-discovery-v2.json
          if-no-files-found: error
          retention-days: 7
