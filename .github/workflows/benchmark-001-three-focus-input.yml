name: Benchmark 001 Three WebGPU Focus Input

on:
  pull_request:
    paths:
      - 'experiments/BYJTT-LAB-001/candidates/three-webgpu/focus-input-gate/**'
      - '.github/workflows/benchmark-001-three-focus-input.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus-input:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE: experiments/BYJTT-LAB-001/candidates/three-webgpu
      CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_HEAD_SHA }}
          persist-credentials: false

      - name: Setup Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: experiments/BYJTT-LAB-001/candidates/three-webgpu/package.json

      - name: Install headed-browser focus dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool x11-utils openbox

      - name: Record exact-head environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE/artifacts/focus-input"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$CANDIDATE_HEAD_SHA"
          {
            echo "candidate_head_sha=$CANDIDATE_HEAD_SHA"
            echo "actual_head_sha=$actual_head"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "chrome=$(google-chrome --version)"
            echo "xvfb_run=$(command -v xvfb-run)"
            echo "xdotool=$(xdotool version | head -1)"
            echo "openbox=$(openbox --version | head -1)"
            echo "os=$(uname -a)"
          } | tee "$CANDIDATE/artifacts/focus-input/environment.txt"

      - name: Materialize and verify exact dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          observed="$(sha256sum package-lock.json | awk '{print $1}')"
          expected="$(tr -d '[:space:]' < focus-input-gate/expected-lock-sha256.txt)"
          printf '%s\n' "$observed" | tee artifacts/focus-input/observed-lock-sha256.txt
          test "$observed" = "$expected"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all --json > artifacts/focus-input/dependency-tree.json

      - name: Build unchanged production candidate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$CANDIDATE" run build 2>&1 | tee "$CANDIDATE/artifacts/focus-input/build.log"

      - name: Re-run unchanged 13-step Phase A browser playthrough
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$CANDIDATE" run test:phase-a 2>&1 | tee "$CANDIDATE/artifacts/focus-input/phase-a.log"

      - name: Execute production focus-loss probe through X11 window manager
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          set +e
          xvfb-run -a -s '-screen 0 1280x1024x24' bash -c 'openbox >/tmp/byjtt-openbox.log 2>&1 & exec node focus-input-gate/probe-focus-loss.mjs' 2>&1 | tee artifacts/focus-input/runtime.log
          probe_status=${PIPESTATUS[0]}
          set -e
          cp /tmp/byjtt-openbox.log artifacts/focus-input/openbox.log 2>/dev/null || true
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('artifacts/focus-input/runtime-result.json', 'utf8'));
          if (result.tested_revision !== process.env.CANDIDATE_HEAD_SHA) throw new Error('exact-head mismatch');
          if (result.runtime_ready !== true) throw new Error('runtime never became ready');
          if (result.production_source_modified !== false || result.direct_input_state_mutation !== false) throw new Error('proof boundary violated');
          if (result.proof_state !== 'focus-input-release-proven') throw new Error(`focus-loss safety not proven: ${result.proof_state}`);
          if (result.focus_before_transfer !== true || result.focus_after_transfer !== false || result.trusted_blur_observed !== true) throw new Error('trusted focus transfer not proven');
          if (result.safe_focus_release_proven !== true) throw new Error('safe focus release not proven');
          if (result.failures.length !== 0) throw new Error(`browser/runtime failures: ${JSON.stringify(result.failures)}`);
          NODE
          test "$probe_status" -eq 0

      - name: Hash retained evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          mkdir -p artifacts/focus-input
          { find artifacts/focus-input -type f ! -name evidence.sha256 -print0; printf '%s\0' package-lock.json; } | sort -z | xargs -0 -r sha256sum > artifacts/focus-input/evidence.sha256

      - name: Upload exact-head focus-input evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: byjtt-lab-001-three-focus-input-${{ github.run_id }}
          path: |
            experiments/BYJTT-LAB-001/candidates/three-webgpu/artifacts/focus-input/**
            experiments/BYJTT-LAB-001/candidates/three-webgpu/package-lock.json
          if-no-files-found: error
          retention-days: 30
