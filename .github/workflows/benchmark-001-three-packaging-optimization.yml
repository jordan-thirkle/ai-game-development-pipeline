name: Benchmark 001 Three Packaging Optimization

on:
  pull_request:
    paths:
      - 'experiments/BYJTT-LAB-001/candidates/three-webgpu/packaging-optimization-gate/**'
      - '.github/workflows/benchmark-001-three-packaging-optimization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging-optimization:
    name: packaging-optimization
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE: experiments/BYJTT-LAB-001/candidates/three-webgpu
      GATE: experiments/BYJTT-LAB-001/candidates/three-webgpu/packaging-optimization-gate
      ARTIFACTS: experiments/BYJTT-LAB-001/candidates/three-webgpu/artifacts/packaging-optimization
      CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_HEAD_SHA }}
          persist-credentials: false

      - name: Setup Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: experiments/BYJTT-LAB-001/candidates/three-webgpu/package.json

      - name: Record exact-head environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$CANDIDATE_HEAD_SHA"
          {
            echo "candidate_head_sha=$CANDIDATE_HEAD_SHA"
            echo "actual_head_sha=$actual_head"
            echo "github_event_sha=${GITHUB_SHA:-}"
            echo "github_event_name=${GITHUB_EVENT_NAME:-}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "chrome=$(google-chrome --version)"
            echo "os=$(uname -a)"
          } | tee "$ARTIFACTS/environment.txt"

      - name: Materialize and verify exact dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          observed="$(sha256sum package-lock.json | awk '{print $1}')"
          expected="$(tr -d '[:space:]' < packaging-optimization-gate/expected-lock-sha256.txt)"
          printf '%s\n' "$observed" | tee artifacts/packaging-optimization/observed-lock-sha256.txt
          npm ls --all --json > artifacts/packaging-optimization/dependency-tree.json || true
          test "$observed" = "$expected"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Build baseline production candidate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$CANDIDATE" run build 2>&1 | tee "$ARTIFACTS/baseline-build.log"
          CANDIDATE="$CANDIDATE" node "$GATE/experiment.mjs" measure baseline

      - name: Re-run unchanged baseline Phase A playthrough
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$CANDIDATE" run test:phase-a 2>&1 | tee "$ARTIFACTS/baseline-phase-a.log"

      - name: Verify baseline Phase A exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          result="$CANDIDATE/artifacts/phase-a/playtest-result.json"
          test -s "$result"
          cp "$result" "$ARTIFACTS/baseline-phase-a-result.json"
          node --input-type=module - "$result" "$ARTIFACTS/baseline-phase-a-revision.json" "$actual_head" "${GITHUB_SHA:-}" baseline <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const [sourcePath, outputPath, expectedHead, eventSha, phase] = process.argv.slice(2);
          const evidence = JSON.parse(readFileSync(sourcePath, 'utf8'));
          if (evidence.candidate_head_revision !== expectedHead) {
            throw new Error(`${phase} Phase A candidate_head_revision ${evidence.candidate_head_revision} does not match checked-out HEAD ${expectedHead}`);
          }
          if (evidence.execution_verified !== true) {
            throw new Error(`${phase} Phase A execution_verified is not true`);
          }
          const wrapper = {
            phase,
            exact_head_verified: true,
            actual_head_sha: expectedHead,
            phase_a_candidate_head_revision: evidence.candidate_head_revision,
            legacy_tested_revision: evidence.tested_revision ?? null,
            legacy_tested_revision_semantics: process.env.GITHUB_EVENT_NAME === 'pull_request'
              ? 'GitHub pull_request event/merge SHA; not the standalone checked-out candidate identity'
              : 'GitHub event SHA; not used as the standalone checked-out candidate identity',
            github_event_sha: eventSha || null
          };
          writeFileSync(outputPath, `${JSON.stringify(wrapper, null, 2)}\n`);
          NODE

      - name: Apply reversible upstream-recommended packaging transform
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$CANDIDATE" node "$GATE/experiment.mjs" apply
          git diff -- "$CANDIDATE/src/main.js" | tee "$ARTIFACTS/transform.diff"
          test -s "$ARTIFACTS/transform.diff"

      - name: Build optimized production candidate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$CANDIDATE" run build 2>&1 | tee "$ARTIFACTS/optimized-build.log"
          CANDIDATE="$CANDIDATE" node "$GATE/experiment.mjs" measure optimized

      - name: Re-run unchanged optimized Phase A playthrough
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$CANDIDATE" run test:phase-a 2>&1 | tee "$ARTIFACTS/optimized-phase-a.log"

      - name: Verify optimized Phase A exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          result="$CANDIDATE/artifacts/phase-a/playtest-result.json"
          test -s "$result"
          cp "$result" "$ARTIFACTS/optimized-phase-a-result.json"
          node --input-type=module - "$result" "$ARTIFACTS/optimized-phase-a-revision.json" "$actual_head" "${GITHUB_SHA:-}" optimized <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const [sourcePath, outputPath, expectedHead, eventSha, phase] = process.argv.slice(2);
          const evidence = JSON.parse(readFileSync(sourcePath, 'utf8'));
          if (evidence.candidate_head_revision !== expectedHead) {
            throw new Error(`${phase} Phase A candidate_head_revision ${evidence.candidate_head_revision} does not match checked-out HEAD ${expectedHead}`);
          }
          if (evidence.execution_verified !== true) {
            throw new Error(`${phase} Phase A execution_verified is not true`);
          }
          const wrapper = {
            phase,
            exact_head_verified: true,
            actual_head_sha: expectedHead,
            phase_a_candidate_head_revision: evidence.candidate_head_revision,
            legacy_tested_revision: evidence.tested_revision ?? null,
            legacy_tested_revision_semantics: process.env.GITHUB_EVENT_NAME === 'pull_request'
              ? 'GitHub pull_request event/merge SHA; not the standalone checked-out candidate identity'
              : 'GitHub event SHA; not used as the standalone checked-out candidate identity',
            github_event_sha: eventSha || null
          };
          writeFileSync(outputPath, `${JSON.stringify(wrapper, null, 2)}\n`);
          NODE

      - name: Compare bundle evidence
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$CANDIDATE" CANDIDATE_HEAD_SHA="$CANDIDATE_HEAD_SHA" node "$GATE/experiment.mjs" compare

      - name: Restore integrated source and prove bounded diff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$ARTIFACTS/main.baseline.js" ]; then
            CANDIDATE="$CANDIDATE" node "$GATE/experiment.mjs" restore
          fi
          git diff --exit-code -- "$CANDIDATE/src/main.js"
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD 2>/dev/null || true)"
          printf '%s\n' "$changed" | tee "$ARTIFACTS/proposed-files.txt"

      - name: Hash retained evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          mkdir -p artifacts/packaging-optimization
          {
            find artifacts/packaging-optimization -type f ! -name evidence.sha256 -print0
            find artifacts/phase-a -type f -print0 2>/dev/null || true
            printf '%s\0' package-lock.json
          } | sort -z | xargs -0 -r sha256sum > artifacts/packaging-optimization/evidence.sha256

      - name: Upload exact-head packaging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: byjtt-lab-001-three-packaging-optimization-${{ github.run_id }}
          path: |
            experiments/BYJTT-LAB-001/candidates/three-webgpu/artifacts/packaging-optimization/**
            experiments/BYJTT-LAB-001/candidates/three-webgpu/artifacts/phase-a/**
            experiments/BYJTT-LAB-001/candidates/three-webgpu/package-lock.json
          if-no-files-found: error
          retention-days: 30
