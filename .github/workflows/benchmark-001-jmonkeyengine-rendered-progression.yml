name: Benchmark 001 jMonkeyEngine rendered progression gate
on:
  pull_request:
    paths:
      - 'experiments/BYJTT-LAB-001/candidates/jmonkeyengine/rendered-progression-gate/**'
      - '.github/workflows/benchmark-001-jmonkeyengine-rendered-progression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered-progression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE: experiments/BYJTT-LAB-001/candidates/jmonkeyengine/rendered-progression-gate
      CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: experiments/BYJTT-LAB-001/candidates/jmonkeyengine/rendered-progression-gate/pom.xml
      - name: Install bounded desktop proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb openbox xdotool imagemagick mesa-utils
      - name: Record exact execution environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE/evidence"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKED_OUT_SHA" = "$CANDIDATE_HEAD_SHA"
          {
            echo "checked_out_sha=$CHECKED_OUT_SHA"
            echo "candidate_head_sha=$CANDIDATE_HEAD_SHA"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "maven=$(mvn -version | head -n 1)"
            echo "os=$(uname -a)"
          } | tee "$CANDIDATE/evidence/environment.txt"
      - name: Strict compile and dependency proof
        shell: bash
        working-directory: ${{ env.CANDIDATE }}
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress clean verify 2>&1 | tee evidence/maven-verify.log
          mvn --batch-mode --no-transfer-progress dependency:tree -DoutputFile=evidence/dependency-tree.txt
          mvn --batch-mode --no-transfer-progress dependency:build-classpath -Dmdep.outputFile=evidence/classpath.txt
          grep -F 'org.jmonkeyengine:jme3-core:jar:3.9.0-stable' evidence/dependency-tree.txt
          grep -F 'org.jmonkeyengine:jme3-lwjgl3:jar:3.9.0-stable' evidence/dependency-tree.txt
          grep -F 'com.github.stephengold:Minie:jar:9.0.3' evidence/dependency-tree.txt
      - name: Execute rendered engine through physical progression input
        shell: bash
        working-directory: ${{ env.CANDIDATE }}
        run: |
          set -euo pipefail
          ARTIFACTS="$PWD/evidence"
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp >"$ARTIFACTS/xvfb.log" 2>&1 &
          XVFB_PID=$!
          sleep 1
          openbox >"$ARTIFACTS/openbox.log" 2>&1 &
          OPENBOX_PID=$!
          APP_PID=""
          cleanup() {
            if [ -n "$APP_PID" ]; then kill "$APP_PID" 2>/dev/null || true; fi
            kill "$OPENBOX_PID" "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          glxinfo -B >"$ARTIFACTS/glxinfo.txt" 2>&1
          CLASSPATH="target/classes:$(cat "$ARTIFACTS/classpath.txt")"
          java -cp "$CLASSPATH" com.byjtt.lab.RenderedProgressionGate "$ARTIFACTS/runtime-result.json" >"$ARTIFACTS/runtime.log" 2>&1 &
          APP_PID=$!
          WINDOW_ID=""
          for _ in $(seq 1 80); do
            WINDOW_ID="$(xdotool search --onlyvisible --name '^BYJTT-LAB-001 jME Rendered Progression$' 2>/dev/null | head -n 1 || true)"
            [ -n "$WINDOW_ID" ] && break
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 0.25
          done
          { echo "window_id=$WINDOW_ID"; xdotool getactivewindow getwindowname 2>&1 || true; } | tee "$ARTIFACTS/window-diagnostics.txt"
          test -n "$WINDOW_ID"
          xdotool windowactivate --sync "$WINDOW_ID"
          xdotool windowfocus --sync "$WINDOW_ID"
          sleep 0.4
          import -window "$WINDOW_ID" "$ARTIFACTS/before-progression.png"

          wait_for_distance() {
            local threshold="$1"
            for _ in $(seq 1 120); do
              if [ -s "$ARTIFACTS/live-observation.json" ]; then
                if node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.exit(r.distance_to_salvage_m <= Number(process.argv[2]) ? 0 : 1);' "$ARTIFACTS/live-observation.json" "$threshold"; then
                  return 0
                fi
              fi
              kill -0 "$APP_PID" 2>/dev/null || return 1
              sleep 0.1
            done
            return 1
          }

          # Route through normal physical keys along the actual shared spawn -> salvage vector:
          # first reduce z from 10 toward 0, then increase x toward 5.
          xdotool keydown --window "$WINDOW_ID" s
          wait_for_distance 5.10
          xdotool keyup --window "$WINDOW_ID" s
          sleep 0.10
          xdotool keydown --window "$WINDOW_ID" d
          wait_for_distance 1.75
          xdotool keyup --window "$WINDOW_ID" d
          sleep 0.15
          xdotool key --window "$WINDOW_ID" space
          sleep 0.2
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.salvage_health!==0 || !r.reward_available) process.exit(1);' "$ARTIFACTS/live-observation.json"

          xdotool keydown --window "$WINDOW_ID" d
          wait_for_distance 1.20
          xdotool keyup --window "$WINDOW_ID" d
          sleep 0.2
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.reward_count!==1 || !r.upgrade_menu_visible) process.exit(1);' "$ARTIFACTS/live-observation.json"
          xdotool key --window "$WINDOW_ID" e
          sleep 0.2
          import -window "$WINDOW_ID" "$ARTIFACTS/after-progression.png"

          set +e
          wait "$APP_PID"
          APP_STATUS=$?
          set -e
          APP_PID=""
          echo "app_exit_status=$APP_STATUS" >> "$ARTIFACTS/window-diagnostics.txt"
          cat "$ARTIFACTS/runtime.log"
          test "$APP_STATUS" -eq 0
          if grep -Eq '(^|[^A-Za-z])(Exception|ERROR|SEVERE)([^A-Za-z]|$)' "$ARTIFACTS/runtime.log"; then exit 1; fi
      - name: Assert machine-readable pass and hash evidence
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$CANDIDATE/evidence/runtime-result.json"
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!r.passed || !r.external_input_executed || !r.rendered_window_executed || !r.gameplay_attack_action_executed || !r.gameplay_interact_action_executed || r.movement_press_callbacks < 3 || r.movement_release_callbacks < 3 || r.attack_press_callbacks < 1 || r.attack_release_callbacks < 1 || r.interact_press_callbacks < 1 || r.interact_release_callbacks < 1 || r.attack_distance_m > 1.8 || r.pickup_distance_m > 1.25 || r.salvage_health !== 0 || r.reward_count !== 1 || !r.damage_upgrade_selected || Math.abs(r.effective_attack_damage-40.8)>0.0001 || r.direct_position_setter_exposed || r.direct_salvage_health_setter_exposed || r.direct_reward_grant_exposed || r.direct_upgrade_grant_exposed || r.post_physics_arena_clamp || !r.observation_copy_isolated || !r.stayed_inside_arena || r.timed_out || r.rendered_frames < 1) process.exit(1);' "$RESULT"
          test -s "$CANDIDATE/evidence/before-progression.png"
          test -s "$CANDIDATE/evidence/after-progression.png"
          sha256sum "$CANDIDATE/pom.xml" "$CANDIDATE/src/main/java/com/byjtt/lab/RenderedProgressionGate.java" "$CANDIDATE/evidence/environment.txt" "$CANDIDATE/evidence/dependency-tree.txt" "$CANDIDATE/evidence/glxinfo.txt" "$CANDIDATE/evidence/window-diagnostics.txt" "$CANDIDATE/evidence/runtime.log" "$RESULT" "$CANDIDATE/evidence/before-progression.png" "$CANDIDATE/evidence/after-progression.png" > "$CANDIDATE/evidence/sha256.txt"
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: byjtt-lab-001-jmonkeyengine-rendered-progression-${{ github.run_id }}
          path: experiments/BYJTT-LAB-001/candidates/jmonkeyengine/rendered-progression-gate/evidence/**
          if-no-files-found: error
          retention-days: 30
