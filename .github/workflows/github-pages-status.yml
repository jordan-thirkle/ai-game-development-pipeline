name: Publish public status to GitHub Pages

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/github-pages-status.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/github-pages-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: validate-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate static public surface
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/status.json
          test -f site/llms.txt
          test -f site/robots.txt
          python3 -m json.tool site/status.json >/dev/null
          if find site -type l | grep -q .; then
            echo 'Symlinks are forbidden in the Pages surface.' >&2
            exit 1
          fi
          if find site -type f -size +1M | grep -q .; then
            echo 'Pages surface contains an unexpectedly large file.' >&2
            exit 1
          fi
          grep -Fq 'This page is documentation/status only.' site/index.html
          grep -Fq 'local-only' site/status.json
          grep -Fq 'not to be claimed until GitHub repository settings report it as enforced' site/llms.txt
      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp -R site/. _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'sha': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'ref': os.environ['GITHUB_REF'],
              'runId': os.environ['GITHUB_RUN_ID'],
          }
          Path('_site/deployment.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
