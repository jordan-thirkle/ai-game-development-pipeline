name: Validate GitHub configuration

on:
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/**'
      - 'config/github-governance.json'
      - 'tools/validate-github-config.mjs'
      - 'tools/test-github-required-check-contexts.mjs'
      - 'tools/validate-action-pins.mjs'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/**'
      - 'config/github-governance.json'
      - 'tools/validate-github-config.mjs'
      - 'tools/test-github-required-check-contexts.mjs'
      - 'tools/validate-action-pins.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate-github-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate immutable Action pins
        run: node tools/validate-action-pins.mjs
      - name: Validate GitHub configuration
        run: npm run validate:github-config
      - name: Adversarially validate required check context names
        run: node --test tools/test-github-required-check-contexts.mjs
