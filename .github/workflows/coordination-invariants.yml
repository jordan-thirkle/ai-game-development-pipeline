name: Verify coordination invariants
on:
  pull_request:
    paths: ['package.json','package-lock.json','schemas/work-unit.schema.json','schemas/pipeline-event.schema.json','fixtures/coordination/**','tools/test-coordination-kernel.mjs','.github/workflows/coordination-invariants.yml']
  push:
    branches: [main]
    paths: ['package.json','package-lock.json','schemas/work-unit.schema.json','schemas/pipeline-event.schema.json','fixtures/coordination/**','tools/test-coordination-kernel.mjs','.github/workflows/coordination-invariants.yml']
permissions:
  contents: read
jobs:
  adversarial-coordination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run adversarial coordination invariants
        run: node tools/test-coordination-kernel.mjs
