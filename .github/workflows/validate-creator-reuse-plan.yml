name: Validate Creator Mode reuse plan

on:
  pull_request:
    paths:
      - 'schemas/creator-reuse-plan.schema.json'
      - 'research/CREATOR-MODE-REUSE-DOGFOOD-001.md'
      - 'examples/creator-mode/reuse-plan-001.json'
      - 'tools/validate-creator-reuse-plan.mjs'
      - '.github/workflows/validate-creator-reuse-plan.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/creator-reuse-plan.schema.json'
      - 'research/CREATOR-MODE-REUSE-DOGFOOD-001.md'
      - 'examples/creator-mode/reuse-plan-001.json'
      - 'tools/validate-creator-reuse-plan.mjs'
      - '.github/workflows/validate-creator-reuse-plan.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Validate canonical Creator Mode reuse plan
        run: node tools/validate-creator-reuse-plan.mjs

      - name: Prove unsafe Creator Mode shortcuts fail closed
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('examples/creator-mode/reuse-plan-001.json', 'utf8'));
          const registry = JSON.parse(fs.readFileSync('registry/open-source-game-reuse.v1.json', 'utf8'));
          const sources = new Map(registry.entries.map((entry) => [entry.entry_id, entry]));

          function clone() {
            return JSON.parse(JSON.stringify(base));
          }
          function capability(plan, id) {
            return plan.capabilities.find((entry) => entry.capability_id === id);
          }
          function write(name, plan) {
            fs.writeFileSync(`/tmp/${name}.json`, JSON.stringify(plan, null, 2));
          }

          // A. Strong-copyleft/reference source may not become production adaptation.
          {
            const plan = clone();
            const controller = capability(plan, 'player-controller-camera');
            const openttd = sources.get('reuse.openttd');
            controller.candidates_considered.push(openttd.entry_id);
            controller.selected_entry_id = openttd.entry_id;
            controller.decision = 'adapt';
            controller.clearance_snapshot = {
              evidence_status: openttd.evidence_status,
              code: openttd.licensing.code_clearance_status,
              assets: openttd.licensing.asset_clearance_status,
              dependencies: openttd.dependency_clearance_status,
            };
            write('creator-copyleft', plan);
          }

          // B. Plan snapshots may not soften canonical review-required evidence.
          {
            const plan = clone();
            const enemy = capability(plan, 'enemy-ai');
            enemy.decision = 'adapt';
            enemy.clearance_snapshot = {
              evidence_status: 'SOURCE-VERIFIED',
              code: 'cleared',
              assets: 'cleared',
              dependencies: 'cleared',
            };
            write('creator-softened-clearance', plan);
          }

          // C. Empty discovery cannot jump directly to bespoke implementation.
          {
            const plan = clone();
            capability(plan, 'inventory-run-loot').decision = 'bespoke_last_resort';
            write('creator-bespoke-shortcut', plan);
          }

          // D. Planning benefit metrics may not be inflated.
          {
            const plan = clone();
            plan.metrics.planned_generic_surface_reduction_pct = 100;
            write('creator-inflated-metrics', plan);
          }

          // E. Discovery telemetry cannot be labelled instrumented with missing values.
          {
            const plan = clone();
            plan.discovery_effort.measurement_status = 'instrumented';
            write('creator-fake-instrumentation', plan);
          }
          NODE

          expect_reject() {
            local file="$1"
            local needle="$2"
            local log="${file}.log"
            if node tools/validate-creator-reuse-plan.mjs "$file" > "$log" 2>&1; then
              echo "Negative Creator Mode probe unexpectedly passed: $file"
              cat "$log"
              exit 1
            fi
            cat "$log"
            grep -F "$needle" "$log"
          }

          expect_reject /tmp/creator-copyleft.json 'player-controller-camera adapt cannot use reuse.openttd'
          expect_reject /tmp/creator-softened-clearance.json 'enemy-ai clearance_snapshot must exactly match the selected registry entry'
          expect_reject /tmp/creator-bespoke-shortcut.json 'inventory-run-loot bespoke_last_resort requires at least one external candidate/search path to have been considered'
          expect_reject /tmp/creator-inflated-metrics.json 'metrics.planned_generic_surface_reduction_pct must equal recomputed value 50'
          expect_reject /tmp/creator-fake-instrumentation.json 'discovery_effort.search_actions must be a non-negative number when instrumented'
