name: Public repository exposure security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  exposure-scan:
    name: exposure-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Validate tracked public surface
        run: node tools/validate-public-exposure.mjs
      - name: Scan complete git history for high-confidence credentials
        run: node tools/scan-git-history-secrets.mjs
