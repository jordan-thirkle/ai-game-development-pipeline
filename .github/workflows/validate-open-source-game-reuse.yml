name: Validate external game reuse gate

on:
  pull_request:
    paths:
      - 'registry/open-source-game-reuse.v1.json'
      - 'schemas/open-source-game-reuse.schema.json'
      - 'research/OPEN-SOURCE-GAME-REUSE-2026-08.md'
      - 'tools/validate-open-source-game-reuse.mjs'
      - '.github/workflows/validate-open-source-game-reuse.yml'
  push:
    branches: [main]
    paths:
      - 'registry/open-source-game-reuse.v1.json'
      - 'schemas/open-source-game-reuse.schema.json'
      - 'research/OPEN-SOURCE-GAME-REUSE-2026-08.md'
      - 'tools/validate-open-source-game-reuse.mjs'
      - '.github/workflows/validate-open-source-game-reuse.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Validate canonical registry
        run: node tools/validate-open-source-game-reuse.mjs
      - name: Prove unsafe promotions fail closed
        shell: bash
        run: |
          set -euo pipefail
          cp registry/open-source-game-reuse.v1.json /tmp/reuse-registry.json
          node <<'NODE'
          const fs = require('fs');
          const path = '/tmp/reuse-registry.json';
          const r = JSON.parse(fs.readFileSync(path, 'utf8'));
          const byId = (id) => {
            const entry = r.entries.find((item) => item.entry_id === id);
            if (!entry) throw new Error(`negative probe missing seed entry ${id}`);
            return entry;
          };
          byId('reuse.dialogic').entry_id = 'reuse.godot-demo-projects';
          byId('reuse.openttd').adoption_status = 'drop_in_candidate';
          const index = byId('reuse.awesome-gamedev');
          index.adoption_status = 'drop_in_candidate';
          r.policy.ranking_weights.popularity = 25;
          r.policy.ranking_weights.task_fit = 10;
          fs.writeFileSync(path, JSON.stringify(r, null, 2));
          NODE
          if node tools/validate-open-source-game-reuse.mjs /tmp/reuse-registry.json > /tmp/reuse-negative.log 2>&1; then
            echo 'Negative probe unexpectedly passed'
            cat /tmp/reuse-negative.log
            exit 1
          fi
          cat /tmp/reuse-negative.log
          grep -F 'duplicate entry_id: reuse.godot-demo-projects' /tmp/reuse-negative.log
          grep -F 'reuse.openttd drop_in_candidate requires permissive or public_domain licence class' /tmp/reuse-negative.log
          grep -F 'reuse.awesome-gamedev drop_in_candidate requires permissive or public_domain licence class' /tmp/reuse-negative.log
          grep -F 'policy.ranking_weights.popularity must be <= 10 because popularity is only a soft discovery signal' /tmp/reuse-negative.log
