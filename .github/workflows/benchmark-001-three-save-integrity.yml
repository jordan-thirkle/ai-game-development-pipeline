name: Benchmark 001 Three WebGPU Save Integrity

on:
  pull_request:
    paths:
      - 'experiments/BYJTT-LAB-001/candidates/three-webgpu/save-integrity-gate/**'
      - '.github/workflows/benchmark-001-three-save-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save-integrity:
    name: save-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE: experiments/BYJTT-LAB-001/candidates/three-webgpu
      CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_HEAD_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: experiments/BYJTT-LAB-001/candidates/three-webgpu/package.json

      - name: Record exact-head environment and ownership
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE/artifacts/save-integrity"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$CANDIDATE_HEAD_SHA"
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git merge-base HEAD origin/main)"; fi
          git diff --name-only "$base"...HEAD | tee "$CANDIDATE/artifacts/save-integrity/changed-files.txt"
          while IFS= read -r file; do
            case "$file" in
              experiments/BYJTT-LAB-001/candidates/three-webgpu/save-integrity-gate/*|.github/workflows/benchmark-001-three-save-integrity.yml) ;;
              '') ;;
              *) echo "Unexpected ownership overlap: $file" >&2; exit 41 ;;
            esac
          done < "$CANDIDATE/artifacts/save-integrity/changed-files.txt"
          {
            echo "candidate_head_sha=$CANDIDATE_HEAD_SHA"
            echo "actual_head_sha=$actual_head"
            echo "base_sha=$base"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "chrome=$(google-chrome --version)"
            echo "os=$(uname -a)"
          } | tee "$CANDIDATE/artifacts/save-integrity/environment.txt"

      - name: Materialize and verify exact dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          observed="$(sha256sum package-lock.json | awk '{print $1}')"
          expected="$(tr -d '[:space:]' < save-integrity-gate/expected-lock-sha256.txt)"
          printf '%s\n' "$observed" | tee artifacts/save-integrity/observed-lock-sha256.txt
          test "$observed" = "$expected"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all --json > artifacts/save-integrity/dependency-tree.json || true

      - name: Syntax-check owned harness
        shell: bash
        run: |
          set -euo pipefail
          node --check "$CANDIDATE/save-integrity-gate/run-save-integrity.mjs" 2>&1 | tee "$CANDIDATE/artifacts/save-integrity/syntax.log"

      - name: Build production candidate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$CANDIDATE" run build 2>&1 | tee "$CANDIDATE/artifacts/save-integrity/build.log"

      - name: Re-run unchanged 13-step Phase A browser playthrough
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$CANDIDATE" run test:phase-a 2>&1 | tee "$CANDIDATE/artifacts/save-integrity/phase-a.log"

      - name: Execute corrupted-save correctness proof
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          node save-integrity-gate/run-save-integrity.mjs 2>&1 | tee artifacts/save-integrity/runtime.log

      - name: Verify machine-readable result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('artifacts/save-integrity/runtime-result.json', 'utf8'));
          if (result.tested_revision !== process.env.CANDIDATE_HEAD_SHA) throw new Error('result is not bound to exact candidate head');
          if (result.production_source_modified_by_gate !== false) throw new Error('gate must not modify production source');
          if (result.persistence_fuzz_counts_as_gameplay_progress !== false) throw new Error('fuzz input must not count as gameplay progress');
          if (result.direct_gameplay_mutation_surface_exposed !== false) throw new Error('gate exposed a gameplay mutation shortcut');
          if (result.human_tested !== false) throw new Error('automation must not claim HUMAN-TESTED');
          if (result.passed !== true) throw new Error(`save-integrity proof failed: ${JSON.stringify(result.failures)}`);
          NODE

      - name: Hash retained evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          mkdir -p artifacts/save-integrity
          {
            find artifacts/save-integrity -type f ! -name evidence.sha256 -print0
            find artifacts/phase-a -type f -print0 2>/dev/null || true
            test ! -f package-lock.json || printf '%s\0' package-lock.json
          } | sort -z | xargs -0 -r sha256sum > artifacts/save-integrity/evidence.sha256

      - name: Upload exact-head save-integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: byjtt-lab-001-three-save-integrity-${{ github.run_id }}
          path: |
            experiments/BYJTT-LAB-001/candidates/three-webgpu/artifacts/save-integrity/**
            experiments/BYJTT-LAB-001/candidates/three-webgpu/artifacts/phase-a/**
            experiments/BYJTT-LAB-001/candidates/three-webgpu/package-lock.json
          if-no-files-found: error
          retention-days: 30
