name: Benchmark 001 libGDX rendered input gate
on:
  pull_request:
    paths:
      - 'experiments/BYJTT-LAB-001/candidates/libgdx/render-input-gate/**'
      - '.github/workflows/benchmark-001-libgdx-render-input.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered-input-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE: experiments/BYJTT-LAB-001/candidates/libgdx/render-input-gate
      CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: experiments/BYJTT-LAB-001/candidates/libgdx/render-input-gate/pom.xml
      - name: Install bounded desktop proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb openbox xdotool imagemagick mesa-utils
      - name: Record exact execution environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE/artifacts/render-input"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKED_OUT_SHA" = "$CANDIDATE_HEAD_SHA"
          {
            echo "checked_out_sha=$CHECKED_OUT_SHA"
            echo "candidate_head_sha=$CANDIDATE_HEAD_SHA"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "maven=$(mvn -version | head -n 1)"
            echo "os=$(uname -a)"
          } | tee "$CANDIDATE/artifacts/render-input/environment.txt"
      - name: Strict compile and package
        shell: bash
        working-directory: ${{ env.CANDIDATE }}
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress clean verify 2>&1 | tee artifacts/render-input/maven-verify.log
      - name: Freeze and validate resolved dependency graph
        shell: bash
        working-directory: ${{ env.CANDIDATE }}
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress dependency:tree -DoutputFile=artifacts/render-input/dependency-tree.txt
          mvn --batch-mode --no-transfer-progress dependency:build-classpath -Dmdep.outputFile=artifacts/render-input/classpath.txt
          grep -F 'com.badlogicgames.gdx:gdx:jar:1.14.2' artifacts/render-input/dependency-tree.txt
          grep -F 'com.badlogicgames.gdx:gdx-backend-lwjgl3:jar:1.14.2' artifacts/render-input/dependency-tree.txt
          grep -F 'com.badlogicgames.gdx:gdx-bullet:jar:1.14.2' artifacts/render-input/dependency-tree.txt
          grep -F 'com.badlogicgames.gdx:gdx-bullet-platform:jar:natives-desktop:1.14.2' artifacts/render-input/dependency-tree.txt
          test -s artifacts/render-input/classpath.txt
      - name: Execute rendered engine with real OS keyboard input
        shell: bash
        working-directory: ${{ env.CANDIDATE }}
        run: |
          set -euo pipefail
          ARTIFACTS="$PWD/artifacts/render-input"
          INPUT_HOLD_SECONDS=8
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp >"$ARTIFACTS/xvfb.log" 2>&1 &
          XVFB_PID=$!
          sleep 1
          openbox >"$ARTIFACTS/openbox.log" 2>&1 &
          OPENBOX_PID=$!
          cleanup() {
            kill "$OPENBOX_PID" "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          glxinfo -B >"$ARTIFACTS/glxinfo.txt" 2>&1 || true

          CLASSPATH="target/classes:$(cat "$ARTIFACTS/classpath.txt")"
          java -cp "$CLASSPATH" com.byjtt.lab.LibgdxRenderedInputGate \
            "$ARTIFACTS/result.json" >"$ARTIFACTS/runtime.log" 2>&1 &
          APP_PID=$!

          WINDOW_ID=""
          for _ in $(seq 1 80); do
            WINDOW_ID="$(xdotool search --onlyvisible --name '^BYJTT-LAB-001 libGDX Bullet$' 2>/dev/null | head -n 1 || true)"
            if [ -n "$WINDOW_ID" ]; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done

          {
            echo "window_id=$WINDOW_ID"
            echo "external_key_hold_seconds=$INPUT_HOLD_SECONDS"
            xdotool search --onlyvisible --name 'libGDX\|BYJTT-LAB' getwindowname %@ 2>&1 || true
            xdotool getactivewindow getwindowname 2>&1 || true
          } | tee "$ARTIFACTS/window-diagnostics.txt"
          test -n "$WINDOW_ID"

          xdotool windowactivate --sync "$WINDOW_ID"
          xdotool windowfocus --sync "$WINDOW_ID"
          sleep 0.5
          import -window "$WINDOW_ID" "$ARTIFACTS/before-input.png"
          xdotool keydown --window "$WINDOW_ID" d
          sleep "$INPUT_HOLD_SECONDS"
          xdotool keyup --window "$WINDOW_ID" d
          sleep 1.5
          import -window "$WINDOW_ID" "$ARTIFACTS/after-release.png" || true

          set +e
          wait "$APP_PID"
          APP_STATUS=$?
          set -e
          echo "app_exit_status=$APP_STATUS" | tee -a "$ARTIFACTS/window-diagnostics.txt"
          cat "$ARTIFACTS/runtime.log"
          test "$APP_STATUS" -eq 0
          if grep -Eq '(^|[^A-Za-z])(Exception|ERROR|SEVERE)([^A-Za-z]|$)' "$ARTIFACTS/runtime.log"; then
            echo 'Unexpected exception/error marker found in runtime.log' >&2
            exit 1
          fi
      - name: Assert machine-readable pass and hash evidence
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$CANDIDATE/artifacts/render-input/result.json"
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!r.passed || !r.external_input_executed || !r.rendered_window_executed || !r.native_wall_stop_observed || !r.release_stable || r.post_physics_arena_clamp || !r.observation_copy_isolated || r.timed_out || r.input_press_callbacks < 1 || r.input_release_callbacks < 1 || r.rendered_frames < 1) process.exit(1);' "$RESULT"
          sha256sum \
            "$CANDIDATE/pom.xml" \
            "$CANDIDATE/src/main/java/com/byjtt/lab/LibgdxRenderedInputGate.java" \
            "$CANDIDATE/artifacts/render-input/dependency-tree.txt" \
            "$CANDIDATE/artifacts/render-input/classpath.txt" \
            "$RESULT" \
            "$CANDIDATE/artifacts/render-input/before-input.png" \
            > "$CANDIDATE/artifacts/render-input/sha256.txt"
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: byjtt-lab-001-libgdx-render-input-${{ github.run_id }}
          path: experiments/BYJTT-LAB-001/candidates/libgdx/render-input-gate/artifacts/render-input/**
          if-no-files-found: error
          retention-days: 30
