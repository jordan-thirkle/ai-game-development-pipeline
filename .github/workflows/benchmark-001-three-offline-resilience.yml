name: Benchmark 001 Three WebGPU Offline Resilience

on:
  pull_request:
    paths:
      - 'experiments/BYJTT-LAB-001/candidates/three-webgpu/offline-resilience-gate/**'
      - '.github/workflows/benchmark-001-three-offline-resilience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-resilience:
    name: offline-resilience
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE: experiments/BYJTT-LAB-001/candidates/three-webgpu
      CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_HEAD_SHA }}
          persist-credentials: false

      - name: Setup Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: experiments/BYJTT-LAB-001/candidates/three-webgpu/package.json

      - name: Record exact-head environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE/artifacts/offline-resilience"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$CANDIDATE_HEAD_SHA"
          {
            echo "candidate_head_sha=$CANDIDATE_HEAD_SHA"
            echo "actual_head_sha=$actual_head"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "chrome=$(google-chrome --version)"
            echo "os=$(uname -a)"
          } | tee "$CANDIDATE/artifacts/offline-resilience/environment.txt"

      - name: Materialize and verify exact dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          observed="$(sha256sum package-lock.json | awk '{print $1}')"
          expected="$(tr -d '[:space:]' < offline-resilience-gate/expected-lock-sha256.txt)"
          printf '%s\n' "$observed" | tee artifacts/offline-resilience/observed-lock-sha256.txt
          test "$observed" = "$expected"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all --json > artifacts/offline-resilience/dependency-tree.json

      - name: Strict JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check "$CANDIDATE/offline-resilience-gate/prove-offline-resilience.mjs" 2>&1 | tee "$CANDIDATE/artifacts/offline-resilience/syntax.log"

      - name: Build production candidate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$CANDIDATE" run build 2>&1 | tee "$CANDIDATE/artifacts/offline-resilience/build.log"

      - name: Re-run unchanged 13-step Phase A browser playthrough
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$CANDIDATE" run test:phase-a 2>&1 | tee "$CANDIDATE/artifacts/offline-resilience/phase-a.log"

      - name: Execute loaded-runtime network-loss proof
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          node offline-resilience-gate/prove-offline-resilience.mjs 2>&1 | tee artifacts/offline-resilience/runtime.log
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('artifacts/offline-resilience/runtime-result.json', 'utf8'));
          const expected = process.env.CANDIDATE_HEAD_SHA;
          console.log('OFFLINE_RESILIENCE_RESULT=' + JSON.stringify(result));
          if (result.tested_revision !== expected) throw new Error(`tested_revision ${result.tested_revision} != ${expected}`);
          if (result.passed !== true || result.execution_verified !== true) throw new Error(`offline resilience failed: ${JSON.stringify(result.failures)}`);
          if (result.offline_transition_executed !== true) throw new Error('browser offline transition not executed');
          if (!(result.offline_movement?.moved_metres > 1.0)) throw new Error('offline physical movement not proven');
          if (!(result.offline_movement?.release_drift_metres <= 0.03)) throw new Error('offline release stability failed');
          if (result.offline_save?.schema_version !== 1) throw new Error('normal offline save path not proven');
          if (result.observation_isolation !== true) throw new Error('offline observation isolation failed');
          if (result.external_http_requests_after_offline.length) throw new Error('external HTTP requests observed after offline transition');
          if (result.console_errors.length || result.page_errors.length) throw new Error('browser errors retained in successful result');
          if (result.first_launch_offline_proven !== false || result.pwa_installability_proven !== false) throw new Error('gate overclaimed offline/PWA support');
          if (result.physical_device_executed !== false || result.target_device_performance_proven !== false || result.human_tested !== false) throw new Error('gate overclaimed device/human evidence');
          NODE

      - name: Hash retained evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          mkdir -p artifacts/offline-resilience
          {
            find artifacts/offline-resilience -type f ! -name 'evidence.sha256' -print0
            find artifacts/phase-a -type f -print0 2>/dev/null || true
            printf '%s\0' package-lock.json
          } | sort -z | xargs -0 -r sha256sum > artifacts/offline-resilience/evidence.sha256

      - name: Upload exact-head offline-resilience evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: byjtt-lab-001-three-offline-resilience-${{ github.run_id }}
          path: |
            experiments/BYJTT-LAB-001/candidates/three-webgpu/artifacts/offline-resilience/**
            experiments/BYJTT-LAB-001/candidates/three-webgpu/artifacts/phase-a/**
            experiments/BYJTT-LAB-001/candidates/three-webgpu/package-lock.json
          if-no-files-found: error
          retention-days: 30
