name: BYJTT-LAB-001 PlayCanvas chase

on:
  pull_request:
    paths:
      - 'experiments/BYJTT-LAB-001/candidates/playcanvas/chase-gate/**'
      - '.github/workflows/benchmark-001-playcanvas-chase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chase-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_DIR: experiments/BYJTT-LAB-001/candidates/playcanvas/chase-gate
      EVIDENCE_DIR: evidence/playcanvas-chase
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind proof to exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          echo "CANDIDATE_HEAD_SHA=$ACTUAL" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$ACTUAL" > "$EVIDENCE_DIR/candidate-head.txt"
      - name: Set up Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '26' }
      - name: Capture environment
        shell: bash
        run: |
          set -euo pipefail
          { node --version; npm --version; uname -a; } | tee "$EVIDENCE_DIR/environment.txt"
      - name: Verify dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          EXPECTED="$(tr -d '[:space:]' < expected-lock-sha256.txt)"
          npm install --package-lock-only --ignore-scripts
          ACTUAL="$(sha256sum package-lock.json | awk '{print $1}')"
          cp package-lock.json "$GITHUB_WORKSPACE/$EVIDENCE_DIR/package-lock.json"
          printf '%s  package-lock.json\n' "$ACTUAL" > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/package-lock.sha256"
          test "$ACTUAL" = "$EXPECTED"
          npm ci --ignore-scripts
          npm ls --all > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/npm-tree.txt"
      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          npm run typecheck 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/typecheck.log"
      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/build.log"
      - name: Install exact Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          npx playwright install --with-deps chromium 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/playwright-install.log"
      - name: Real browser chase execution
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR" CANDIDATE_HEAD_SHA="$CANDIDATE_HEAD_SHA" timeout 120s npm run test:browser 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/runtime.log"
      - name: Validate machine-readable result
        shell: bash
        run: |
          set -euo pipefail
          node - "$EVIDENCE_DIR/runtime-result.json" "$CANDIDATE_HEAD_SHA" <<'NODE'
          const fs = require('fs');
          const [file, head] = process.argv.slice(2);
          const r = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (r.candidate_head !== head || r.passed !== true) throw new Error('exact-head runtime did not pass');
          const o = r.observation;
          if (o.arena.width !== 24 || o.arena.depth !== 32) throw new Error('shared arena changed');
          if (o.playerSpawn.z !== 10 || o.enemySpawn.z !== -6) throw new Error('shared spawns changed');
          if (r.checks.post_navigation_clamp !== false || r.checks.post_physics_arena_clamp !== false) throw new Error('clamp detected');
          if (r.checks.external_input_delivered !== true || r.checks.acquisition_legitimate !== true || r.checks.distance_reduced !== true) throw new Error('gameplay proof incomplete');
          NODE
      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "$EVIDENCE_DIR" -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/sha256sums.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: byjtt-lab-001-playcanvas-chase-${{ github.run_id }}
          path: evidence/playcanvas-chase
          if-no-files-found: error
          retention-days: 30
