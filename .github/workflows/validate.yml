name: Validate lab structure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
      - name: Validate repository
        run: npm run validate
