name: Validate lab structure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate repository
        run: npm run validate
      - name: Validate pipeline record fixture
        run: npm run validate:record -- pipeline-run examples/records/pipeline-run.valid.json
      - name: Validate graduation record fixture
        run: npm run validate:record -- game-graduation examples/records/game-graduation.valid.json
      - name: Exercise graduation gate
        run: npm run gate:graduation -- examples/records/game-graduation.valid.json
