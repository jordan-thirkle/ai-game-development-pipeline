name: Validate lab structure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate repository
        run: npm run validate
      - name: Validate bounded Studio brief flow
        run: node --test tools/test-studio-brief.mjs
      - name: Validate downloadable local starter bundle
        run: node --test tools/test-studio-bundle.mjs
      - name: Validate browser-readable verification page
        run: node --test tools/test-studio-verification-page.mjs
      - name: Validate inline Studio verification summary
        run: node --test tools/test-studio-inline-verification.mjs
      - name: Validate committed record fixtures
        run: |
          npm run validate:record -- pipeline-run examples/records/pipeline-run.valid.json
          npm run validate:record -- game-graduation examples/records/game-graduation.valid.json
          npm run validate:record -- game-status examples/records/game-status.valid.json
          npm run validate:record -- reuse-candidate registry/reuse/playcanvas-third-person-controller.json
      - name: Exercise graduation gate
        run: npm run gate:graduation -- examples/records/game-graduation.valid.json
      - name: Generate safe record scaffolds
        run: |
          npm run new:record -- pipeline-run /tmp/byjtt-records/pipeline.json scaffold-pipeline
          npm run new:record -- game-graduation /tmp/byjtt-records/graduation.json scaffold-game
          npm run new:record -- game-status /tmp/byjtt-records/status.json scaffold-game
          npm run new:record -- reuse-candidate /tmp/byjtt-records/reuse.json scaffold-reuse
      - name: Validate generated scaffolds
        run: |
          npm run validate:record -- pipeline-run /tmp/byjtt-records/pipeline.json
          npm run validate:record -- game-graduation /tmp/byjtt-records/graduation.json
          npm run validate:record -- game-status /tmp/byjtt-records/status.json
          npm run validate:record -- reuse-candidate /tmp/byjtt-records/reuse.json scaffold-reuse
