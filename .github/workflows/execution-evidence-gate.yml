name: Require execution evidence
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  execution-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Fetch PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/evidence-head"
      - name: Check execution evidence for sensitive changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/check-execution-evidence.mjs
