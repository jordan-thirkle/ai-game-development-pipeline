name: Control plane browser QA
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: control-plane-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record browser QA revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          {
            echo '### Control plane browser QA revision'
            echo
            echo "- exact revision: \`$actual\`"
            echo "- event: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Detect browser-sensitive changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          zero='0000000000000000000000000000000000000000'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [ "$PUSH_HEAD_SHA" = "$zero" ]; then
            echo 'Deleted ref has no resulting revision to browser-test.'
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$PUSH_BEFORE_SHA" = "$zero" ]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            range="$empty_tree..$PUSH_HEAD_SHA"
          else
            range="$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA"
          fi
          changed="$(git diff --name-only "$range")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(apps/studio/|fixtures/control-plane/|tools/(studio-server|studio-brief|studio-bundle|studio-verification-page|studio-starter-home-page|test-studio-server|test-studio-brief|test-studio-brief-browser|test-studio-success-variation-browser|test-studio-portable-brief-import|test-studio-portable-bundle-import|test-studio-portable-brief-import-browser|test-studio-bundle|test-studio-verification-page|test-studio-solved-system-summary|test-studio-publishing-plan|test-studio-inline-verification|test-studio-inline-publishing-plan|test-studio-inline-publishing-browser|test-studio-inline-qa-artifact-browser|test-studio-failed-attempt-evidence|test-studio-failed-attempt-browser|test-studio-failed-attempt-edit-browser|test-studio-starter-home-release-candidate|test-studio-starter-home-release-browser|test-starter-handoff-browser|test-control-plane-browser|run-pipeline|control-plane-freshness)\.mjs$|\.github/workflows/control-plane-browser-qa\.yml$)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7.0.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '26'
      - name: Dogfood solved-system summary against the real sample pipeline
        if: steps.changes.outputs.run == 'true'
        run: node --test tools/test-studio-solved-system-summary.mjs
      - name: Dogfood dry-run publishing plan against the real sample pipeline
        if: steps.changes.outputs.run == 'true'
        run: node --test tools/test-studio-publishing-plan.mjs
      - name: Dogfood inline Studio publishing plan against the real sample pipeline
        if: steps.changes.outputs.run == 'true'
        run: node --test tools/test-studio-inline-publishing-plan.mjs
      - name: Validate inline Studio QA artifact proof
        if: steps.changes.outputs.run == 'true'
        run: node --test tools/test-studio-inline-verification.mjs
      - name: Validate starter-home release-candidate projection
        if: steps.changes.outputs.run == 'true'
        run: node --test tools/test-studio-starter-home-release-candidate.mjs
      - name: Adversarially validate failed-attempt receipts
        if: steps.changes.outputs.run == 'true'
        run: node --test tools/test-studio-failed-attempt-evidence.mjs
      - name: Adversarially validate portable starter brief import
        if: steps.changes.outputs.run == 'true'
        run: node --test tools/test-studio-portable-brief-import.mjs
      - name: Adversarially validate downloaded starter bundle import
        if: steps.changes.outputs.run == 'true'
        run: node --test tools/test-studio-portable-bundle-import.mjs
      - name: Install pinned Playwright package
        if: steps.changes.outputs.run == 'true'
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.0
      - name: Dogfood failed attempt evidence in real Chrome
        if: steps.changes.outputs.run == 'true'
        env:
          BROWSER_ARTIFACTS: artifacts/control-plane-browser
        run: node tools/test-studio-failed-attempt-browser.mjs
      - name: Dogfood editing recovered failed brief in real Chrome
        if: steps.changes.outputs.run == 'true'
        env:
          BROWSER_ARTIFACTS: artifacts/control-plane-browser
        run: node tools/test-studio-failed-attempt-edit-browser.mjs
      - name: Dogfood starter-home release candidate in real Chrome
        if: steps.changes.outputs.run == 'true'
        env:
          BROWSER_ARTIFACTS: artifacts/control-plane-browser
        run: node tools/test-studio-starter-home-release-browser.mjs
      - name: Serve Studio and local dry-run pipeline
        if: steps.changes.outputs.run == 'true'
        run: |
          node tools/studio-server.mjs --port=4173 > /tmp/control-plane-server.log 2>&1 &
          echo $! > /tmp/control-plane-server.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/apps/studio/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/control-plane-server.log
          exit 1
      - name: Dogfood portable starter continuation in real Studio Chrome
        if: steps.changes.outputs.run == 'true'
        env:
          CONTROL_PLANE_URL: http://127.0.0.1:4173/apps/studio/
          BROWSER_ARTIFACTS: artifacts/control-plane-browser
        run: node tools/test-studio-portable-brief-import-browser.mjs
      - name: Dogfood verified brief variation in real Studio Chrome
        if: steps.changes.outputs.run == 'true'
        env:
          CONTROL_PLANE_URL: http://127.0.0.1:4173/apps/studio/
          BROWSER_ARTIFACTS: artifacts/control-plane-browser
        run: node tools/test-studio-success-variation-browser.mjs
      - name: Dogfood inline publishing plan in real Studio Chrome
        if: steps.changes.outputs.run == 'true'
        env:
          CONTROL_PLANE_URL: http://127.0.0.1:4173/apps/studio/
          BROWSER_ARTIFACTS: artifacts/control-plane-browser
        run: node tools/test-studio-inline-publishing-browser.mjs
      - name: Dogfood inline QA artifact proof in real Studio Chrome
        if: steps.changes.outputs.run == 'true'
        env:
          CONTROL_PLANE_URL: http://127.0.0.1:4173/apps/studio/
          BROWSER_ARTIFACTS: artifacts/control-plane-browser
        run: node tools/test-studio-inline-qa-artifact-browser.mjs
      - name: Run direct browser QA
        if: steps.changes.outputs.run == 'true'
        env:
          CONTROL_PLANE_URL: http://127.0.0.1:4173/apps/studio/
          BROWSER_ARTIFACTS: artifacts/control-plane-browser
        run: node tools/test-control-plane-browser.mjs
      - name: Dogfood bounded Studio brief flow
        if: steps.changes.outputs.run == 'true'
        env:
          CONTROL_PLANE_URL: http://127.0.0.1:4173/apps/studio/
          BROWSER_ARTIFACTS: artifacts/control-plane-browser
        run: node tools/test-studio-brief-browser.mjs
      - name: Dogfood downloaded starter handoff
        if: steps.changes.outputs.run == 'true'
        env:
          BROWSER_ARTIFACTS: artifacts/control-plane-browser
        run: node tools/test-starter-handoff-browser.mjs
      - name: Upload browser evidence
        if: steps.changes.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-browser-${{ github.run_id }}
          path: |
            artifacts/control-plane-browser/**
            /tmp/control-plane-server.log
          if-no-files-found: warn
      - name: Report path-aware skip
        if: steps.changes.outputs.run != 'true'
        run: echo 'No browser-sensitive files changed; direct browser execution not required for this revision.'